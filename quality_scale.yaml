# Quality Scale for Buienradar Home Assistant Integration

domain: buienradar
name: Buienradar
quality_scale: silver

rules:
  # Bronze Rules
  config-flow:
    status: done
    comment: Full UI config flow implemented in config_flow.py.
  test-before-setup:
    status: done
    comment: Connectivity test during config flow step.
  unique-id:
    status: done
    comment: Entities configured with stable unique IDs.
  entity-event-setup:
    status: done
    comment: Proper async_added_to_hass implementation.
  has-entity-name:
    status: done
    comment: Standard entity naming guidelines followed.
  common-modules:
    status: done
    comment: Split into standard platform modules (sensor, weather, camera, binary_sensor).
  action-setup:
    status: done
    comment: No legacy service registration needed.
  docs-high-level-description:
    status: done
    comment: Documented in README.md and home-assistant.md.
  docs-installation-instructions:
    status: done
    comment: Clear HACS and manual installation steps provided.
  brand-assets:
    status: done
    comment: standard brand images hosted via Home Assistant architecture repository.

  # Silver Rules
  action-exceptions:
    status: done
    comment: Proper error handling for API connection failures.
  config-entry-unloading:
    status: done
    comment: Clean async_unload_entry support.
  log-when-unavailable:
    status: done
    comment: Coordinator handles logging on communication failure.
  entity-category:
    status: done
    comment: Diagnostics and configuration entity categories configured.

  # Gold Rules
  entity-translations:
    status: done
    comment: Over 40 translation files available in translations/ directory.
  devices:
    status: done
    comment: Devices properly registered in Device Registry.
