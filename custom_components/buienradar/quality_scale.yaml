# Assessment against Home Assistant Core 2026.10.4 quality-scale rules.
# No quality tier is claimed; todo items must be resolved before claiming Silver.
# Source: https://github.com/home-assistant/core/blob/2026.10.4/script/hassfest/quality_scale.py
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no custom actions.
  appropriate-polling:
    status: done
    comment: Weather and rain poll every 10 minutes; camera requests use a configurable cache interval.
  brands:
    status: todo
    comment: Brand assets for this custom integration have not been verified.
  common-modules:
    status: todo
    comment: Unused Buienalarm modules still reference missing constants and modules.
  config-flow:
    status: todo
    comment: The flow passes an unsupported api keyword to the pinned parser and lacks a cannot_connect translation.
  config-flow-test-coverage:
    status: todo
    comment: No complete config-flow test suite exists.
  dependency-transparency:
    status: todo
    comment: Dependency ownership and maintenance information still needs review.
  docs-actions:
    status: exempt
    comment: The integration registers no custom actions.
  docs-conditions:
    status: exempt
    comment: The integration registers no custom conditions.
  docs-high-level-description:
    status: done
    comment: README.md describes the weather service and its purpose.
  docs-installation-instructions:
    status: done
    comment: README.md documents HACS custom-repository registration and manual installation.
  docs-removal-instructions:
    status: todo
    comment: Removal instructions are not documented.
  docs-triggers:
    status: exempt
    comment: The integration registers no custom triggers.
  entity-event-setup:
    status: done
    comment: Rain listeners use CoordinatorEntity; existing BrData polling timers are cancelled during unload.
  entity-unique-id:
    status: done
    comment: Active platforms assign IDs based on coordinates, sensor keys, or the config entry ID.
  has-entity-name:
    status: todo
    comment: Weather, camera, and rain entities still use fixed names without has_entity_name.
  runtime-data:
    status: todo
    comment: Weather and sensor data use entry.runtime_data; the rain coordinator still uses hass.data.
  test-before-configure:
    status: todo
    comment: The station lookup passes an unsupported parser keyword and uses precipitation text as weather data.
  test-before-setup:
    status: todo
    comment: Rain performs a first refresh; validation across all platforms still needs assessment.
  unique-config-entry:
    status: done
    comment: The config flow sets a coordinate-based unique ID and aborts duplicates.
  # Silver
  action-exceptions:
    status: exempt
    comment: The integration registers no custom actions.
  config-entry-unloading:
    status: done
    comment: Platforms unload before BrData timers and the stored rain coordinator are removed.
  docs-configuration-parameters:
    status: todo
    comment: README.md lists options and defaults but does not yet explain all ranges and constraints.
  docs-installation-parameters:
    status: todo
    comment: Latitude and longitude are mentioned but their defaults and constraints need documentation.
  entity-unavailable:
    status: todo
    comment: Rain uses coordinator availability; weather and metric sensors can retain stale states on failures.
  integration-owner:
    status: todo
    comment: Manifest codeowners have not been confirmed as maintainers of this custom repository.
  log-when-unavailable:
    status: todo
    comment: BrData logs repeated failures instead of logging only availability transitions.
  parallel-updates:
    status: todo
    comment: Platforms do not explicitly declare PARALLEL_UPDATES.
  reauthentication-flow:
    status: exempt
    comment: The public Buienradar service requires no authentication.
  test-coverage:
    status: todo
    comment: Integration-wide coverage above 95 percent has not been demonstrated.
  # Gold
  devices:
    status: exempt
    comment: The integration provides weather service data rather than physical devices.
  diagnostics:
    status: todo
    comment: No diagnostics.py implementation exists.
  discovery:
    status: exempt
    comment: The service is configured using user-selected coordinates and has no discoverable local devices.
  discovery-update-info:
    status: exempt
    comment: There is no discovery flow or discovered connection information.
  docs-data-update:
    status: todo
    comment: Data polling intervals are not documented for users.
  docs-examples:
    status: done
    comment: README.md includes an awning automation example.
  docs-known-limitations:
    status: todo
    comment: Known limitations are not collected in the user documentation.
  docs-supported-devices:
    status: exempt
    comment: The integration provides weather service data rather than physical devices.
  docs-supported-functions:
    status: done
    comment: README.md describes the weather, radar, rain, and metric entities.
  docs-troubleshooting:
    status: todo
    comment: Only debug logging is documented; actionable problem-specific guidance is missing.
  docs-use-cases:
    status: done
    comment: README.md describes awning, window, and notification use cases.
  dynamic-devices:
    status: exempt
    comment: The integration has no dynamically discovered physical devices.
  entity-category:
    status: todo
    comment: Station and metadata sensor categories need assessment.
  entity-device-class:
    status: todo
    comment: Device classes across all entities need assessment.
  entity-disabled-by-default:
    status: done
    comment: Metric sensors and the radar camera are disabled by default.
  entity-translations:
    status: todo
    comment: Metric sensors have translations; rain, weather, and camera names still need translation keys.
  exception-translations:
    status: todo
    comment: Exceptions do not use translation keys.
  icon-translations:
    status: todo
    comment: Icons are hardcoded and no icons.json exists.
  reconfiguration-flow:
    status: todo
    comment: Options are editable but no reconfigure step exists for coordinates.
  repair-issues:
    status: todo
    comment: Recoverable failures are logged without repair issues.
  stale-devices:
    status: exempt
    comment: The integration registers no physical devices.
  # Platinum
  async-dependency:
    status: done
    comment: Active platforms use aiohttp for network I/O and the Buienradar library only for parsing and URLs.
  inject-websession:
    status: done
    comment: Active platforms obtain the shared session with async_get_clientsession.
  strict-typing:
    status: todo
    comment: Untyped methods remain and no strict type-checking gate is configured.
