name: Jules Quality Scale Audit

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  quality-audit:
    name: Audit Home Assistant Quality Scale
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Create Quality Audit Session
        id: jules
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${JULES_API_KEY:-}" ]; then
            echo "Warning: JULES_API_KEY secret is not configured." >&2
            exit 0
          fi

          OWNER="${REPOSITORY%%/*}"
          REPO="${REPOSITORY#*/}"
          API="https://jules.googleapis.com/v1alpha"
          AUTH_HEADER="X-Goog-Api-Key: ${JULES_API_KEY}"

          SOURCES=$(curl --silent --show-error \
            --url "${API}/sources" \
            --header "${AUTH_HEADER}" || echo "{}")

          SOURCE_INFO=$(jq -cer \
            --arg owner "${OWNER}" \
            --arg repo "${REPO}" \
            '[.sources[]? | select(
              .githubRepo.owner == $owner and
              .githubRepo.repo == $repo
            )][0] // empty' <<< "${SOURCES}") || {
              echo "Warning: ${REPOSITORY} is not available as a Jules source." >&2
              exit 0
            }

          SOURCE=$(jq -r '.name // empty' <<< "${SOURCE_INFO}")
          DEFAULT_BRANCH=$(jq -r '.githubRepo.defaultBranch.displayName // empty' <<< "${SOURCE_INFO}")

          PROMPT=$(cat <<EOF
          Audit quality_scale.yaml against the implementation in custom_components/buienradar:
          1. Verify each rule marked 'done' in quality_scale.yaml corresponds to working code.
          2. Check if any silver/gold quality scale requirements can be upgraded.
          3. Report findings or open a PR updating quality_scale.yaml if necessary.
          EOF
          )

          PAYLOAD=$(jq -n \
            --arg prompt "${PROMPT}" \
            --arg source "${SOURCE}" \
            --arg branch "${DEFAULT_BRANCH}" \
            --arg title "Quality Scale Audit" \
            '{
              prompt: $prompt,
              title: $title,
              sourceContext: {
                source: $source,
                githubRepoContext: {
                  startingBranch: $branch
                }
              }
            }')

          RESPONSE=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url "${API}/sessions" \
            --header "${AUTH_HEADER}" \
            --header "Content-Type: application/json" \
            --data "${PAYLOAD}") || exit 0

          SESSION=$(jq -r '.name // empty' <<< "${RESPONSE}")
          echo "Created quality audit session: ${SESSION}"
